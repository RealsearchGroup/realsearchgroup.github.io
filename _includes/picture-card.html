{% assign picture = include.picture %}

{% if picture.link %}
    {% assign pic-url = picture.link %}
{% else %}
    {% capture pic-url %}{{ site.base }}{{ picture.url }}{% endcapture %}
{% endif %}

{% capture imgurl %}{% include img-url.html src=picture.image %}{% endcapture %}

<figure class="gallery-item">
    {% if picture.image %}
        <button type="button" class="gallery-thumb" data-full="{{ imgurl | strip }}" data-caption="{{ picture.title | escape }}" aria-label="Enlarge: {{ picture.title | escape }}">
            <img src="{{ imgurl | strip }}" alt="{{ picture.title }}" loading="lazy"/>
        </button>
    {% endif %}
    <figcaption class="gallery-caption">
        {% if picture.notitle != true %}<h3 class="gallery-title">{{ picture.title }}</h3>{% endif %}
        {% if picture.subtitle != null and picture.subtitle != "" %}<h4 class="gallery-subtitle">{{ picture.subtitle }}</h4>{% endif %}
        <div class="gallery-desc">{{ picture.description | markdownify }}</div>
        {% if picture.no-link != true or picture.link %}
            <a class="card-more" href="{{ pic-url }}">Read more &raquo;</a>
        {% endif %}
    </figcaption>
</figure>
