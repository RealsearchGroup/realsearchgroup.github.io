name: Realsearch Research Group
url: 
baseurl: 

exclude: [README.md, CONTRIBUTING.md, Makefile, Gemfile, Gemfile.lock, vendor, scripts]

# colorize code snippets with the pygments module
highlighter: rouge

# The path structure for blog posts.
permalink: /blog/:year/:month/:day/:title.html

# Sections on the "people" page (people with other roles are not listed).
roles:
  - key: faculty
    name: Faculty
    single: Faculty
  - key: postdoc
    name: Post Doc
    single: Post Doc
  - key: grad
    name: PhD Students
    single: PhD Student
  - key: alum
    name: Alumni
    single: Alum
    list: true
  - key: ms
    name: Undergraduate and Masters Alumni
    single: Undergraduate / Masters Alum
    list: true

# Show the Active/Sleeping badge on research project cards (set to true to bring it back).
show_project_status: false

# Number of news stories on the front page.
front_page_news: 5

# Base pathname for links.
base: ''

# make pages for the _projects folder
collections:
  projects:
    output: true
    permalink: /projects/:path:output_ext
  pictures:
    output: true
    permalink: /pictures/:path:output_ext
  people:
    output: true
    permalink: /people/:name/
  publications:
    output: false

defaults:
  - scope:
      path: ""
      type: people
    values:
      layout: person
      notitle: true

# Navigation bar links.
navigation:
  - title: Home
    link: /
  - title: People
    link: /people.html
  - title: Research
    link: /research.html
  - title: Publications
    link: /publications.html
  - title: Gallery
    link: /pics.html
  - title: News 
    link: /blog.html
  - title: Contact
    link: /code.html
